services:
  bird-service:
    image: bird-service:latest
    env_file: "secret.env"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/birdwatching_birds
      - SPRING_DATASOURCE_USERNAME=postgres
      - SERVER_PATH=${SERVER_PATH}
      - SERVER_PORT=${BIRDS_PORT}
      - BIRDS_PATH=${BIRDS_PATH}
    ports:
      - ${BIRDS_PORT}:${BIRDS_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: user-service:latest
    env_file: "secret.env"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/birdwatching_users
      - SPRING_DATASOURCE_USERNAME=postgres
      - SERVER_PATH=${SERVER_PATH}
      - SERVER_PORT=${USERS_PORT}
      - AUTH_PATH=${AUTH_PATH}
      - USERS_PATH=${USERS_PATH}
    ports:
      - ${USERS_PORT}:${USERS_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  sighting-service:
    image: sighting-service:latest
    env_file: "secret.env"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/birdwatching_sightings
      - SPRING_DATASOURCE_USERNAME=postgres
      - SERVER_PATH=${SERVER_PATH}
      - SERVER_PORT=${SIGHTINGS_PORT}
      - SIGHTINGS_PATH=${SIGHTINGS_PATH}
      - BIRDS_PATH=${BIRDS_PATH}
      - USERS_PATH=${USERS_PATH}
      - GATEWAY_HOST=${GATEWAY_HOST}
      - GATEWAY_PORT=${GATEWAY_PORT}
      - RABBIT_HOST=${RABBIT_HOST}
      - RABBIT_PORT=${RABBIT_PORT}
      - RABBIT_USERNAME=guest
      - SIGHTINGS_QUEUE=${SIGHTINGS_QUEUE}
    ports:
      - ${SIGHTINGS_PORT}:${SIGHTINGS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  postgres:
    image: postgres
    restart: always
    user: postgres
    volumes:
      - ./docker-postgresql-multiple-databases:/docker-entrypoint-initdb.d # script for multiple db support
      - db-data:/var/lib/postgresql
    env_file: "secret.env"
    environment:
      - POSTGRES_MULTIPLE_DATABASES="birdwatching_birds", "birdwatching_users", "birdwatching_sightings"
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbit:
    image: rabbitmq:3.13-management
    env_file: "secret.env"
    expose:
      - ${RABBIT_PORT}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: birdwatching-gateway:latest
    environment:
      - SERVER_PATH=${SERVER_PATH}
      - SERVER_PORT=${GATEWAY_PORT}
      - BIRDS_PORT=${BIRDS_PORT}
      - USERS_PORT=${USERS_PORT}
      - BIRDS_PATH=${BIRDS_PATH}
      - AUTH_PATH=${AUTH_PATH}
      - USERS_PATH=${USERS_PATH}
    ports:
      - ${GATEWAY_PORT}:${GATEWAY_PORT}

volumes:
  db-data:


