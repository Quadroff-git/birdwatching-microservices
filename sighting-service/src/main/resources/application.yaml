spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:secret.env[.properties]
  application:
    name: sighting-service
  datasource:
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USERNAME}
    password: ${RABBITMQ_DEFAULT_PASS}

server:
  port: ${SIGHTINGS_PORT}
  servlet:
    context-path: ${SERVER_PATH}

api:
  queue:
    name: ${SIGHTINGS_QUEUE}
  paths:
    sightings: ${SIGHTINGS_PATH}
    birds: ${BIRDS_PATH}
    users: ${USERS_PATH}
  gateway:
    host: ${GATEWAY_HOST}
    port: ${GATEWAY_PORT}

jwt:
  secret: ${JWT_SECRET}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [sighting-service] [correlationId=%X{correlationId:-}] [%thread] %-40.40logger{39} : %msg%n%ex"