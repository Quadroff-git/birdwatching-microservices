logging:
  level:
    org.springframework.cloud.gateway: trace

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: bird-service
              uri: http://localhost:8081/
              predicates:
                - Path=/api/birds/**
            - id: user-service
              uri: http://localhost:8082/
              predicates:
                - Path=/api/users/**

  application:
    name: gateway