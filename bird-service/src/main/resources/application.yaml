spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:secret.env[.properties]
  application:
    name: bird-service
  datasource:
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create

api:
  paths:
    birds: ${BIRDS_PATH}

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${BIRDS_PORT}
  servlet:
    context-path: ${SERVER_PATH}

logging:
  level:
    PERFORMANCE: INFO
  log-dir: ${LOG_DIR:logs}
  file:
    name: ${logging.log-dir}/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
      clean-history-on-start: true
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [bird-service] [correlationId=%X{correlationId:-}] [%thread] %-40.40logger{39} : %msg%n%ex"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [bird-service] [correlationId=%X{correlationId:-}] [%thread] %-40.40logger{39} : %msg%n%ex"

performance:
  slow-threshold-ms: ${PERFORMANCE_SLOW_THRESHOLD_MS:1000}