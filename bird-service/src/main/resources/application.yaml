spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:secret.env[.properties]
  application:
    name: bird-service
  datasource:
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create

api:
  paths:
    birds: ${BIRDS_PATH}

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${BIRDS_PORT}
  servlet:
    context-path: ${SERVER_PATH}