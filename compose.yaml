services:
  bird-service:
    image: bird-service:latest
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/birdwatching_birds
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_USERNAME=postgres
    ports:
      - 8081:8081
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: user-service:latest
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/birdwatching_users
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_USERNAME=postgres
    ports:
      - 8082:8082
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres
    restart: always
    user: postgres
    volumes:
      - ./docker-postgresql-multiple-databases:/docker-entrypoint-initdb.d # script for multiple db support
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES="birdwatching_birds", "birdwatching_users"
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: birdwatching-gateway:latest
    ports:
      - 8080:8080 # actually forwarding queries to the services probably requires more configuration

volumes:
  db-data:


