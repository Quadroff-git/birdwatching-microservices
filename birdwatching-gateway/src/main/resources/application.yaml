spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: bird-service
              uri: http://bird-service:${BIRDS_PORT}/
              predicates:
                - Path=${BIRDS_PATH}/**
            - id: user-service
              uri: http://user-service:${USERS_PORT}/
              predicates:
                - Path=${USERS_PATH}/**, ${AUTH_PATH}/**
            - id: sighting-service
              uri: http://sighting-service:${SIGHTINGS_PORT}/
              predicates:
                  - Path=${SIGHTINGS_PATH}/**

  application:
    name: gateway

logging:
  level:
    org:
      springframework:
        cloud:
          gateway: TRACE

server:
  port: ${GATEWAY_PORT}
  servlet:
    context-path: ${SERVER_PATH}