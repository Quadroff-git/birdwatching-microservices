spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: bird-service
              uri: http://bird-service:8081/
              predicates:
                - Path=/api/birds/**
            - id: user-service
              uri: http://user-service:8082/
              predicates:
                - Path=/api/users/**,/api/auth/**

  application:
    name: gateway