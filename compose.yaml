services:
  bird-service:
    image: bird-service:latest
    env_file:
    - "secret.env"
    - ".env"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/birdwatching_birds
      - LOG_DIR=/tmp/logs
    ports:
      - ${BIRDS_PORT}:${BIRDS_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: user-service:latest
    env_file:
    - "secret.env"
    - ".env"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/birdwatching_users
    ports:
      - ${USERS_PORT}:${USERS_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  sighting-service:
    image: sighting-service:latest
    env_file:
    - "secret.env"
    - ".env"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/birdwatching_sightings
      - LOG_DIR=/tmp/logs
    ports:
      - ${SIGHTINGS_PORT}:${SIGHTINGS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  postgres:
    image: postgres
    restart: always
    user: postgres
    volumes:
      - ./docker-postgresql-multiple-databases:/docker-entrypoint-initdb.d # script for multiple db support
      - db-data:/var/lib/postgresql
    env_file: "secret.env"
    environment:
      - POSTGRES_MULTIPLE_DATABASES="birdwatching_birds", "birdwatching_users", "birdwatching_sightings"
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbit:
    image: rabbitmq:3.13-management
    env_file: "secret.env"
    expose:
      - ${RABBIT_PORT}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: birdwatching-gateway:latest
    env_file: ".env"
    ports:
      - ${GATEWAY_PORT}:${GATEWAY_PORT}

volumes:
  db-data:


